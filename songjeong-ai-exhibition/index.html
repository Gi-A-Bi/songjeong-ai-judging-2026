<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>송정 AI 작품마을</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2/dist/galmuri.css">
<link rel="stylesheet" href="style.css?v=20261106a">
</head>
<body>
<a class="skip" href="#listOpen">작품 목록으로 건너뛰기</a>
<header class="top">
  <div class="brand">
    <span class="tag">서울송정초등학교 · 2026 AI 페스티벌</span>
    <h1><span class="logo" aria-hidden="true">🏡</span> 송정 AI 작품마을</h1>
  </div>
  <nav aria-label="전시관 바로가기" id="nav"></nav>
</header>

<main id="main">
  <div class="stage" id="stage">
    <canvas id="world" tabindex="0" aria-label="송정 AI 작품마을 지도. 방향키로 걷고, 작품 앞에서 스페이스를 누르면 크게 봅니다. 화면을 누르면 그곳으로 걸어갑니다."></canvas>
    <div class="hud hud-top">
      <span class="place" id="place"></span>
      <div class="hud-right">
        <canvas id="minimap" width="150" height="100" class="minimap" aria-hidden="true"></canvas>
      <div class="hud-buttons">
        <button id="listOpen" class="hud-btn">📋 작품 목록</button>
        <button id="pickOpen" class="hud-btn" aria-label="캐릭터 바꾸기">🧑‍🎨</button>
      </div>
      </div>
    </div>
    <div class="hud hud-bottom">
      <div class="dpad" role="group" aria-label="이동 버튼">
        <button data-dir="up" aria-label="위로 이동">▲</button>
        <button data-dir="left" aria-label="왼쪽으로 이동">◀</button>
        <button data-dir="down" aria-label="아래로 이동">▼</button>
        <button data-dir="right" aria-label="오른쪽으로 이동">▶</button>
      </div>
      <button id="prompt" class="prompt" hidden></button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
  </div>
  <p class="help">⌨️ 방향키·WASD로 걷기, 스페이스로 보기 · 📱 화면을 톡 누르면 그곳으로 걸어가고, 작품을 누르면 바로 보러 가요.</p>
</main>

<footer>
  <p>이 전시는 감상용 정적 페이지입니다. 화면의 작품은 감상 기능을 확인하기 위한 예시이며, 학교가 정한 공개 범위에 따라 실제 작품으로 교체됩니다.</p>
</footer>

<!-- 캐릭터 고르기 -->
<dialog id="pick" aria-labelledby="pickTitle">
  <div class="panel">
    <h2 id="pickTitle">나의 캐릭터를 골라요</h2>
    <p class="muted">마을을 함께 걸어 다닐 친구예요. 언제든 바꿀 수 있어요.</p>
    <div class="avatars" id="avatars"></div>
    <div class="panel-foot"><button id="pickGo" class="primary">입장하기</button></div>
  </div>
</dialog>

<!-- 작품 목록 -->
<dialog id="list" aria-labelledby="listTitle">
  <div class="panel">
    <div class="panel-head"><h2 id="listTitle"></h2><form method="dialog"><button class="close" aria-label="닫기">✕</button></form></div>
    <div class="tools">
      <label for="search">🔍 <input type="search" id="search" placeholder="제목으로 찾기" autocomplete="off"></label>
      <p class="count" id="count" aria-live="polite"></p>
      <nav class="zones" id="zones" aria-label="구역 바로가기"></nav>
    </div>
    <div class="sections" id="sections"></div>
  </div>
</dialog>

<!-- 작품 보기 -->
<dialog id="viewer" aria-labelledby="title">
  <div class="viewer">
    <div class="viewer-head">
      <span class="chip" id="chip"></span>
      <h2 id="title"></h2>
      <div class="zoom-tools" id="zoomTools">
        <button id="zoomIn" aria-label="확대">＋</button>
        <button id="zoomOut" aria-label="축소">－</button>
      </div>
      <form method="dialog"><button class="close" aria-label="닫기">✕ 닫기</button></form>
    </div>
    <div class="vstage" id="vstage"></div>
    <p class="caption" id="caption"></p>
    <div class="viewer-foot">
      <div class="group" id="pageTools">
        <button id="prevPage">‹ 이전 쪽</button>
        <button id="nextPage">다음 쪽 ›</button>
      </div>
      <p class="page" id="page" aria-live="polite"></p>
      <div class="group">
        <button id="prevWork">‹ 이전 작품</button>
        <button id="nextWork">다음 작품 ›</button>
      </div>
    </div>
  </div>
</dialog>

<script src="works.js?v=20261106a"></script>
<script src="awards.js?v=20261106a"></script>
<script src="sprites.js?v=20261106a"></script>
<script src="art.js?v=20261106a"></script>
<script src="maps.js?v=20261106a"></script>
<script src="game.js?v=20261106a"></script>
<script src="app.js?v=20261106a"></script>
</body>
</html>
