<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>송정 AI 작품마을</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="top">
  <div>
    <span class="tag">서울송정초등학교 · 2026 AI 페스티벌</span>
    <h1>송정 AI 작품마을</h1>
  </div>
  <nav aria-label="전시관 바로가기" id="nav"></nav>
</header>

<main id="main">
  <section id="plaza" aria-labelledby="plazaTitle">
    <h2 id="plazaTitle" class="sr-only">중앙 광장</h2>
    <p class="hint">방향키나 화면 버튼으로 걸어가서 전시관 입구로 들어가거나, 입구를 바로 눌러요.</p>
    <div class="village" id="map" role="group" aria-label="중앙 광장 지도">
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div><div class="cloud c3" aria-hidden="true"></div>
      <div class="path" aria-hidden="true"></div>
      <div class="fountain" aria-hidden="true"></div>
      <span class="flag" aria-hidden="true">송정 AI 작품마을</span>
      <span class="tree" style="left:6%;top:70%" aria-hidden="true">🌳</span>
      <span class="tree" style="left:12%;top:88%" aria-hidden="true">🌲</span>
      <span class="tree" style="left:30%;top:84%" aria-hidden="true">🌼</span>
      <span class="tree" style="left:70%;top:86%" aria-hidden="true">🌷</span>
      <span class="tree" style="left:88%;top:72%" aria-hidden="true">🌳</span>
      <span class="tree" style="left:94%;top:90%" aria-hidden="true">🌲</span>
      <span id="avatar" class="avatar" aria-hidden="true">🤖</span>
    </div>
    <div class="dpad" role="group" aria-label="이동 버튼">
      <button data-move="ArrowUp" aria-label="위로 이동">↑</button>
      <button data-move="ArrowLeft" aria-label="왼쪽으로 이동">←</button>
      <button data-move="ArrowDown" aria-label="아래로 이동">↓</button>
      <button data-move="ArrowRight" aria-label="오른쪽으로 이동">→</button>
    </div>
    <p class="plaza-foot" id="plazaStatus" aria-live="polite"></p>
  </section>

  <section id="gallery" class="room" hidden>
    <div class="room-head">
      <button class="back" id="backPlaza">← 중앙 광장</button>
      <h2 id="room" tabindex="-1"></h2>
    </div>
    <p class="room-intro" id="roomIntro"></p>
    <div class="tools">
      <label for="search">🔍 작품 찾기 <input type="search" id="search" placeholder="제목으로 찾기" autocomplete="off"></label>
      <p class="count" id="count" aria-live="polite"></p>
      <nav class="zones" id="zones" aria-label="구역 바로가기"></nav>
    </div>
    <div id="sections"></div>
  </section>
</main>

<footer>
  <p>이 전시는 감상용 정적 페이지입니다. 화면의 작품은 감상 기능을 확인하기 위한 예시이며, 학교가 정한 공개 범위에 따라 실제 작품으로 교체됩니다.</p>
</footer>

<dialog id="viewer" aria-labelledby="title">
  <div class="viewer">
    <div class="viewer-head">
      <span class="chip" id="chip"></span>
      <h2 id="title"></h2>
      <div class="zoom-tools" id="zoomTools">
        <button id="zoomIn" aria-label="확대">＋</button>
        <button id="zoomOut" aria-label="축소">－</button>
      </div>
      <form method="dialog"><button class="close" aria-label="닫기">✕ 닫기</button></form>
    </div>
    <div class="stage" id="stage"></div>
    <p class="caption" id="caption"></p>
    <div class="viewer-foot">
      <div class="group" id="pageTools">
        <button id="prevPage">‹ 이전 쪽</button>
        <button id="nextPage">다음 쪽 ›</button>
      </div>
      <p class="page" id="page" aria-live="polite"></p>
      <div class="group">
        <button id="prevWork">‹ 이전 작품</button>
        <button id="nextWork">다음 작품 ›</button>
      </div>
    </div>
  </div>
</dialog>

<script src="works.js"></script>
<script src="app.js"></script>
</body>
</html>
